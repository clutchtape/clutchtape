<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb066"/><stop offset="1" stop-color="#ff5a1f"/></linearGradient></defs>
<rect width="64" height="64" rx="15" fill="#0f0d0b"/>
<!-- segmented scope ring: four arcs with gaps at the compass points -->
<g fill="none" stroke="url(#g)" stroke-width="4.2" stroke-linecap="round">
<path d="M19.5 14.6A20 20 0 0 1 44.5 14.6"/>
<path d="M49.4 19.5A20 20 0 0 1 49.4 44.5"/>
<path d="M44.5 49.4A20 20 0 0 1 19.5 49.4"/>
<path d="M14.6 44.5A20 20 0 0 1 14.6 19.5"/>
</g>
<!-- short inward ticks + outer pips, like a range-finding reticle -->
<g stroke="url(#g)" stroke-width="3.2" stroke-linecap="round">
<path d="M32 9.5v6.5M32 48v6.5M9.5 32H16M48 32h6.5"/>
</g>
<!-- diagonal bracket notches -->
<g fill="none" stroke="#ff9a5a" stroke-width="2" stroke-linecap="round" opacity=".85">
<path d="M22 27v-5h5M42 27v-5h-5M22 37v5h5M42 37v5h-5"/>
</g>
<!-- play mark = the tape -->
<path d="M28.6 26v12l10-6z" fill="url(#g)"/>
</svg>
