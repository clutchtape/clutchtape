{# Analysis trends (2026-10-09): every player on one chart; rendered by static/analysis_trends.js from #analysis-data #}
<section class="board-panel trends" id="trends">
  <article class="tr-card"><div class="tr-head"><h2>CSR</h2><label>Playlist <select id="tr-playlist" aria-label="Ranked playlist"></select></label></div>
    <div class="tr-legend" data-legend="csr"></div><div class="tr-canvas" data-tr="csr"></div></article>
  <article class="tr-card"><div class="tr-head"><h2>Trend</h2><label>Stat <select id="tr-metric" aria-label="Stat"></select></label>
    <label>Show <select id="tr-mode" aria-label="Line type"><option value="rolling">Rolling 5-game average</option><option value="game">Every game</option></select></label></div>
    <div class="tr-legend" data-legend="trend"></div><div class="tr-canvas" data-tr="trend"></div></article>
</section>
